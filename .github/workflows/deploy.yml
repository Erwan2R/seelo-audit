name: Deploy Seelo Audit

on:
  push:
    branches: [main]

jobs:

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set sha tag
        id: vars
        run: echo "sha_tag=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_API_KEY }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }}/seelo-audit:latest
            rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }}/seelo-audit:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=registry,ref=rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }}/seelo-audit:buildcache
          cache-to:   type=registry,ref=rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }}/seelo-audit:buildcache,mode=max

  cleanup:
    name: Cleanup Registry
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: devoxa/scaleway-container-registry-prune-action@v1
        with:
          scw-secret-token: ${{ secrets.SCW_API_KEY }}
          image: rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }}/seelo-audit
          tag-pattern: '^[a-f0-9]{7}$'
          keep-last: 5

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy stack
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.sha_tag }}"
          ssh -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            IMAGE_TAG="$IMAGE_TAG" \
            SCW_REGISTRY_NAMESPACE="${{ secrets.SCW_REGISTRY_NAMESPACE }}" \
            SCW_API_KEY="${{ secrets.SCW_API_KEY }}" \
            bash << 'ENDSSH'
            set -e
            cd /opt/seelo-audit
            echo "$SCW_API_KEY" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin

            export SCW_REGISTRY_NAMESPACE IMAGE_TAG
            # Le nom du secret change avec le contenu du fichier, ce qui force
            # un redéploiement quand .env change.
            export ENV_HASH=$(sha256sum .env | cut -c1-12)

            docker stack deploy -c docker-compose.yml --with-registry-auth seelo-audit
          ENDSSH

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            docker service rollback seelo-audit_seelo-audit || true
