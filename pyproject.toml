[project]
name = "seelo-audit"
version = "0.1.0"
description = "Auditeur de tunnel de réservation pour praticiens du bien-être"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "playwright>=1.45",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pillow>=10.3",
    "opencv-python-headless>=4.10,<5",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "tldextract>=5.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "types-PyYAML>=6.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
seelo-audit = "seelo_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seelo_audit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
